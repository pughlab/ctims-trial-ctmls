additional_criteria_requirements:
  - "For Dose-escalation Cohorts: Have a histologically confirmed
    advanced/metastatic solid tumor and have received, been intolerant to, or
    been ineligible for treatments known to confer clinical benefit. Solid
    tumors of any type are eligible for enrollment. Tumor types of greatest
    interest include, but are not limited to, malignant melanoma, HNSCC, and
    breast carcinoma."
  - Have a performance status of 0 or 1 on the ECOG Performance Scale.
  - "For All Participants: Have at least 1 cutaneous or subcutaneous lesion
    amenable to IT injection and must be measurable and meet 1 of the following
    criteria (per RECIST 1.1)"
  - "For Dose-escalation Cohorts 2a, 3a, or 4a and Expansion Cohorts (Arms A and
    B) ONLY: Have baseline biopsy performed from one of the injectable lesions
    that are planned for IT injection and with tumor tissue provided."
  - "Exclusion: Has had chemotherapy, definitive radiation, or biological cancer
    therapy within 4 weeks (2 weeks for palliative radiation) prior to the first
    dose of study intervention or has not recovered to CTCAE Grade 1 or better
    from any AEs that were due to cancer therapeutics administered more than 4
    weeks earlier (this includes participants with previous immunomodulatory
    therapy with residual immune-related AEs). Participants receiving ongoing
    replacement hormone therapy for endocrine immune-related AEs will not be
    excluded from participation in this study."
  - "Exclusion: Has a history of a second malignancy, unless potentially
    curative treatment has been completed with no evidence of malignancy for 2
    years. Note: The time requirement does not apply to participants who
    underwent successful definitive resection of basal cell carcinoma of the
    skin, superficial bladder cancer or in situ cervical cancer, or other
    in-situ cancers."
  - "Exclusion: Has received prior treatment with either NDV or hIL-12."
  - "Exclusion: Is currently participating and receiving study intervention in a
    study of an investigational agent or has participated and received study
    intervention in a study of an investigational agent or has used an
    investigational device within 28 days of administration of V938."
trial_id: NCT04135352
long_title: A Phase 1/1b, Open-label Clinical Study of
  Intratumoral/Intralesional Administration of V938 in Combination with
  Pembrolizumab (MK-3475) in Participants with Advanced/Metastatic or Recurrent
  Malignancies
protocol_no: 001-08
phase: I
short_title: Phase 1/1b Open-label Study of V938 plus pembrolizumab for advanced
  solid tumors
age: Adult
nct_purpose: The purpose of this study is to evaluate the safety, efficacy,
  pharmacokinetics, and V938 shedding in participants with advanced/metastatic
  or recurrent malignancies who receive V938 in combination with pembrolizumab
  (MK-3475). The primary objective is to determine the safety and tolerability
  and to identify a recommended Phase 2 dose (RP2D) of V938 administered in
  combination with pembrolizumab.
