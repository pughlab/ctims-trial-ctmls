additional_criteria_requirements:
  - Diagnosis of advanced and/or metastatic solid tumors. Participants whose
    tumors have known sensitizing mutations must have experienced disease
    progression (during or after treatment) or intolerance to treatment with a
    respective targeted therapy. More detailed criteria for Parts I, II, and III
    are defined further below.
  - Measurable disease according to Response Evaluation Criteria in Solid Tumors
    version 1.1. (RECIST v1.1). Previously irradiated lesions must not be
    counted as target lesions, unless there has been demonstrated progression in
    the lesion and no other target lesions are available.
  - Life expectancy of >= 12 weeks, as assessed by the Investigator and
    supported by the Real wOrld PROgnostic (ROPRO) score. In case the patient’s
    score is above the cut-off of 0.7, the patient may still be enrolled
    provided that per the Investigator’s judgment the clinical benefits of
    enrollment will outweigh the risks.
  - Eastern Cooperative Oncology Group (ECOG) Performance Status of 0 or 1.
  - "Able to provide the most recent archival tumor tissue samples
    (formalin-fixed-paraffin-embedded [FFPE] blocks preferred; if not available,
    slides accepted). If no archival samples are available. The following for
    more specific inclusions per Parts:"
  - Able to provide skin punch biopsy at screening and at C2D8. For Part II and
    Part III able to provide a fresh tumor biopsy at screening and C2D8.
  - "Part I and II specific inclusion: In the absence of sufficient archival
    tissue, a fresh biopsy from a safely accessible site, per Investigator
    determination and patient consent, will be requested, providing the patient
    has more than one measurable target lesion. Note: if fresh biopsy cannot be
    obtained, please contact the Medical Monitor."
  - "Exclusion: Prior treatment with CPIs, immunomodulatory agents and/or mAbs,
    and/or mAb derived therapies, or immunostimulatory agents is not allowed.
    For Part II only: Prior treatment with anti-CTLA4 is prohibited."
  - "Exclusion: Prior treatment with a CC chemokine receptor 4 (CCR4)-targeting
    (e.g., mogamulizumab) or a CD25-targeting agent (e.g., basiliximab) is
    prohibited. "
  - "Exclusion: Prior allogeneic stem cell or solid organ transplantation."
  - "Exclusion: For Part II only: Prior treatment with anti-CTLA4 is prohibited."
trial_id: NCT04642365
long_title: An Open-Label, Multicenter, Phase Ib Study To Evaluate The Safety,
  Tolerability, Pharmacokinetics, Pharmacodynamics, And Preliminary Anti-Tumor
  Activity Of RO7296682 In Combination With Atezolizumab In Participants With
  Advanced And/Or Metastatic Solid Tumors
protocol_no: BP42595
phase: I
short_title: A Phase Ib Study To Evaluate Ro7296682 In Combination With
  Atezolizumab In Participants With Advanced And/Or Metastatic Solid Tumors
nct_purpose: To evaluate the safety, tolerability, maximum tolerated dose (MTD)
  and/or recommended Phase 2 dose (RP2D) (Part I only) of RO7296682 when
  administered in combination with atezolizumab.
status: Terminated
