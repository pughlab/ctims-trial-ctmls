additional_criteria_requirements:
  - Capable of giving signed, written informed consent. Male or female, age >=18
    years
  - "Histological or cytological documentation of an invasive malignancy that
    was diagnosed as locally advanced/metastatic or relapsed/refractory and is
    of one of the following tumor types: bladder/urothelial cancer of the upper
    and lower urinary tract; cervical; colorectal (includes appendix);
    esophagus, squamous cell; head and neck carcinoma; melanoma; malignant
    pleural mesothelioma (MPM); non-small-cell lung cancer (NSCLC), prostate;
    Microsatellite Instability-High/deficient mismatch repair (MSI-H/dMMR) tumor
    (Part 1B and Part 2B) and Human Papilloma Virus (HPV)-positive or
    Epstein-Barr (EBV)-positive tumor (Part 1B and Part 2B)."
  - "Disease that has progressed after standard therapy for the specific tumor
    type, or for which standard therapy has proven to be ineffective,
    intolerable, or is considered inappropriate, or if no further standard
    therapy exists; exceptions are in these tumor types in which pembrolizumab
    single agent may be a standard: NSCLC, head and neck squamous cell cancer
    (HNSCC), bladder/urothelial cancer, MSI-H/dMMR cancers and melanoma and
    cervical cancer. In Part 2B pembrolizumab combination expansion cohorts,
    prior treatment with anti-Programmed cell death protein 1(PD-1)/ Ligand-1
    (L1) may not be required. 1) Participants must not have received more than 5
    prior lines of therapy for advanced disease including both standards of care
    and investigational therapies. 2) Participants who received prior PD-1/L1
    therapy must fulfill the following requirements (Part 1B [except PK/PD
    cohort]/ Part 2B):a) Have achieved a CR, PR or SD and subsequently had
    disease progression while still on PD-1/L1 therapy; b) Have received at
    least 2 doses of an approved PD-1/L1 inhibitor (by any regulatory
    authority), c) Have demonstrated disease progression as defined by Response
    Evaluation Criteria in Solid Tumors (RECIST) version 1.1 within 18 weeks
    from the last dose of the PD-1/L1 inhibitor. The initial evidence of disease
    progression is to be confirmed by a second assessment no less than four
    weeks from the date of the first documented Progressive Disease (PD) (the
    confirmatory scan could be the Baseline eligibility scan for this study). 3)
    In Part 2A 5-fluorouracil (FU)/platinum combination with GSK3359609 and
    pembrolizumab cohort, participants must not have received prior systemic
    therapy administered in the recurrent or metastatic setting (with the
    exception of systemic therapy given as part of multimodal treatment for
    locally advanced disease)."
  - Archival tumor tissue obtained at any time from the initial diagnosis to
    study entry; a fresh tumor biopsy using a procedure that is safe for the
    participant on a lesion not previously irradiated unless lesion progressed
    will be required if archival tissue is unavailable.
  - Agree to undergo a pre-treatment and on-treatment biopsy and have disease
    amenable to biopsy required in PK/pharmacodynamic Cohort (Part 1B), dose
    randomized HNSCC, HNSCC CPS<1, Melanoma dose expansion cohorts, Biomarker
    cohort, and PK/PD phase of Part 2A combination cohorts.
  - Measurable disease per RECIST version 1.1. Eastern Cooperative Oncology
    Group (ECOG) performance status (PS) 0-1. Life expectancy of at least 12
    weeks.
  - Documented MSI-H or dMMR-positive tumor as determined by local laboratory
    for  Part 1B and Part 2B pembrolizumab combination MSI-H/dMMR expansion
    cohorts  only.
  - "Gene expression (GEX) result using an analytically validated method by
    central  laboratory may also be required for Part 1B Biomarker Cohort only.
    Participants may  be required to have a defined GEX result for eligibility;
    refer to Section 8.2 for  details. "
  - Documented Human Papilloma Virus (HPV)/ Epstein-Barr (EBV)-positive tumor
    as  determined by a local laboratory for Part 1B and Part 2B
    pembrolizumab  combination viral-positive expansion cohorts only
  - "Exclusion Criteria: Prior treatment with the following therapies:
    •\tAnticancer therapy within 30 days or 5 half-lives of the drug, whichever
    is shorter. At least 14 days must have elapsed between the last dose of
    prior anticancer agent and the first dose of study drug is administered.
    •\tPart 2B (GSK3359609 (feladilimab)/pembrolizumab combination): prior
    pembrolizumab washout is not required"
  - "Exclusion Criteria: Prior radiation therapy:  permissible if at least one
    non-irradiated measurable lesion is available for assessment according to
    RECIST version 1.1 or if a solitary measurable lesion was irradiated,
    objective progression is documented. A wash out of at least two weeks before
    start of study drug for radiation of any intended use to the extremities for
    bone metastases and 4 weeks for radiation to the chest, brain, or visceral
    organs is required."
  - "Exclusion Criteria:  Radiation therapy to the lung that is >30 Gy requires
    a greater than 6 month washout from first dose of study treatment."
  - "Exclusion Criteria:  Investigational therapy within 30 days or 5 half-lives
    of the investigational product (whichever is shorter). At least 14 days must
    have elapsed between the last dose of investigational agent and the first
    dose of study drug is administered."
  - "Exclusion Criteria: Prior allogeneic tissue or other solid organ
    transplantation."
trial_id: NCT02723955
long_title: A Phase I Open Label study of GSK3359609 (feladilimab) administered
  alone and in combination with anticancer agents in subjects with selected
  advanced solid tumors
protocol_no: TMF-11734800
protocol_version_date: 2021-08-20T04:00:00.000Z
protocol_version_no: 204691/Amendment 09
phase: I
short_title: Dose Escalation and Expansion Study of GSK3359609 in Participants
  With Selected Advanced Solid Tumors (INDUCE-1)
nct_purpose: This is an open-label, multicenter study designed to evaluate the
  safety, tolerability,  pharmacokinetics (PK), pharmacodynamics, and
  preliminary clinical activity of  GSK3359609 (feladilimab) administered
  intravenously to participants with selected  advanced or recurrent solid
  tumors.
status: Completed
age: Adult
