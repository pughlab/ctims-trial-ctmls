          uuid: dba2c38a-c027-4fc4-a063-d4ae542a1c5d
          arm_code: "Part 1A: Dose Escalation BMS-986218 Monotherapy Phase"
          arm_internal_id: "1"
          arm_suspended: N
          arm_description: The BMS-986218 Monotherapy Dose Escalation will escalate the
            dose of BMS-986218 to determine the monotherapy maximum tolerated
            dose (MTD)/recommended Phase 2 dose (RP2D).
        - dose_level:
            - level_code: BMS-986218
              level_internal_id: "2"
              level_suspended: N
              level_description: BMS-986218 on a Q2W or Q4W schedule
          arm_additional_criteria_not_captured:
            - additional_criteria_requirement_name: "Participants with advanced stage
                cutaneous melanoma must have received, and  then progressed,
                relapsed, or become intolerant to at least one standard
                treatment  of proven survival benefit in the advanced or
                metastatic setting. Additionally,  participants with cutaneous
                melanoma must have also been offered mutation\x02directed
                therapy (including but not limited to targeted therapy if BRAF
                V600  activating mutation) that has proven survival benefit if
                indicated. If a participant  refuses such mutation-directed
                therapy, it must be documented in the medical  record. Only
                cutaneous melanoma is allowed. Mucosal and
                uveal/ocular  melanomas are not permitted; melanoma with unknown
                primary site may be  enrolled if the investigator determines
                mucosal and uveal/ocular primary sites are  unlikely."
            - additional_criteria_requirement_name: Participants with NSCLC (squamous or
                adenocarcinoma), MSS CRC, or SCCHN  (oral cavity, pharyngeal,
                oropharyngeal, hypopharynx, or laryngeal tumors only)  must have
                received, and then progressed, relapsed, or become intolerant to
                at least  2 standard treatment regimens with proven survival
                benefit in the advanced or  metastatic setting according to
                tumor type, if such therapies exist. If the participant refuses
                or is not eligible for these regimens, the reason must be
                documented in the  medical record.
          uuid: 450cf85f-568d-4d17-a9d9-174773959c98
          arm_code: Part 1A Pharmacodynamic (PD) Cohort
          arm_description: Participants with advanced stage cutaneous melanoma, MSS CRC,
            NSCLC, or SCCHN will be treated with BMS-986218 on a Q2W schedule at
            a starting dose of 20 mg in the Part 1A PD cohort.
          arm_internal_id: "2"
          arm_suspended: N
          match:
            - and:
                - or:
                    - clinical:
                        age_expression: ">=18"
                        oncotree_primary_diagnosis: Cutaneous Melanoma
