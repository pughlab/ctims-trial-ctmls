                        - prior_treatment:
                            treatment_category: Medical Therapy
                            agent_class: Anti-PD-L1 Monoclonal Antibody
          arm_description: The Randomized BMS-986218 Monotherapy Cohort Expansion in
            Cutaneous Melanoma will evaluate the preliminary efficacy of
            BMS-986218 monotherapy relative to ipilimumab monotherapy
        - dose_level:
            - level_code: BMS-986218
              level_internal_id: "7"
              level_suspended: N
              level_description: "Three dose levels or schedules for BMS-986218 from the Part
                1A Q4W monotherapy escalation will be evaluated that have had at
                least 6 DLT evaluable participants and meet safety criteria: one
                at 7 mg Q4W, one at 20 mg Q4W, and one at 70 mg Q4W. BMS-986218
                will be administered for a maximum duration of 2 calendar years
                when dosed Q4W"
          arm_additional_criteria_not_captured:
            - additional_criteria_requirement_name: Participants must have received, and then
                progressed, relapsed, or been intolerant to at  least 2 standard
                systemic therapies with proven survival benefit according to
                their tumor types in the advanced or metastatic setting, if
                available. If the participant refuses  or is not eligible for
                these regimens, the reason must be documented in the
                medical  record.
            - additional_criteria_requirement_name: Additionally, participants must have
                progressed or have recurrent disease after  prior immunotherapy
                with anti-PD-1/anti-PD-L1 either by itself or in combination
                with  other systemic therapy agents. No more than 1 intervening
                therapy is allowed but not  required between prior
                anti-PD-1/anti-PD-L1 containing regimen and BMS-986218.
            - additional_criteria_requirement_name: "Participants who have been intolerant to
                prior immunotherapy are excluded. Prior anti\x02CTLA4 therapy is
                allowed for no more than 20% of participants, and details
                of  treatment (including dates, doses, and response) must be
                available."
            - additional_criteria_requirement_name: (1) Lung/NSCLC (adenocarcinoma or squamous
                cell carcinoma); additionally, for  NSCLC, all participants with
                adenocarcinoma must have known EGFR, ALK, and  ROS-1 status.
                Participants with an activating EGFR mutation, ALK
                translocation,  or ROS-1 mutation must have received appropriate
                inhibitor therapy. (2) Other tumor histologies may also be
                included by the Sponsor.
          uuid: e63e21ed-5b75-47b0-9072-c71d4c8373bf
