                least 6 DLT evaluable participants and meet safety criteria: one
                at 7 mg Q4W, one at 20 mg Q4W, and one at 70 mg Q4W."
            - level_code: Ipilimumab
              level_internal_id: "6"
              level_description: Ipilimumab 3 mg/kg (Q3W, 3-week treatment cycle for up to a
                maximum of 4 doses [which are to be completed within 16 weeks of
                the first dose in case of any delays]).
              level_suspended: N
          arm_additional_criteria_not_captured:
            - additional_criteria_requirement_name: Participants with advanced stage
                cutaneous  melanoma who have received all standard therapies
                with proven survival benefit  including prior immunotherapy with
                an anti-PD-1 or anti-PD-L1 containing regimen  and must have
                progressive or recurrent disease after prior PD-1/PD-L1
                directed  therapy.
            - additional_criteria_requirement_name: Participants must not have received prior
                anti-CTLA-4 therapy in the advanced or metastatic setting.
          uuid: 8a6d2c17-8729-401d-93ab-186091fd4c58
          arm_code: "Part 2A: BMS-986218 Monotherapy Cohort Expansion in Cutaneous
            Melanoma"
          arm_internal_id: "4"
          arm_suspended: N
