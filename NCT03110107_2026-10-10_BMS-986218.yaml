                            - clinical:
                                age_expression: ">=18"
                                oncotree_primary_diagnosis: Colorectal Adenocarcinoma
                            - genomic:
                                variant_category: Signature
                                ms_status: MSS
        - dose_level:
            - level_code: BMS-986218
              level_internal_id: "3"
              level_suspended: N
              level_description: Starting at least 1 dose level lower than the current
                monotherapy dose level of BMS-986218 demonstrating an acceptable
                safety profile
            - level_code: Nivolumab
              level_internal_id: "4"
              level_suspended: N
              level_description: Fixed Nivolumab dose at 480mg Q4W
          arm_additional_criteria_not_captured:
            - additional_criteria_requirement_name: " Select solid tumor histologies will be
                permitted during dose escalation, except for  participants with
                CNS metastases as the only site of active disease. The
                included  histologies will be NSCLC (squamous or
                adenocarcinoma), gastric adenocarcinoma  (including GE
                junction), TNBC, CRC (adenocarcinoma), pancreatic
                adenocarcinoma,  metastatic castrate resistant prostate
                adenocarcinoma, urothelial carcinoma, or SCCHN (oral cavity,
                pharyngeal, oropharyngeal, hypopharynx, or laryngeal tumors
                only). Any  other cancers of the head and neck, including
                salivary gland and neuroendocrine  tumors, are excluded from
                enrollment. Histologically confirmed recurrent or
                metastatic  carcinoma of the nasopharynx, SCC or other cancers
                of the skin of head and neck, and  non-squamous histologies are
                not allowed. Additional tumor histologies may also be  included
                by the Sponsor"
            - additional_criteria_requirement_name: Participants must have received, and then
                progressed, relapsed, or been intolerant to at  least 2 systemic
                therapy regimens with proven survival benefit in the advanced
                or  metastatic setting according to tumor type, where available.
                If the participant refuses  or is not eligible for these
                regimens, the reason must be documented in the medical  record.
                However, if anti-PD-1 therapy is approved in a given indication,
                participants  are eligible to receive this treatment as part of
                the combination regimen in this study  prior to having completed
                2 prior systemic therapy regimens after discussion
                and  agreement with the Medical Monitor (or designee). For
                hormone-sensitive cancers, all  previously received and
                available hormonal therapies will be considered as 1
                systemic  therapy regimen for the purposes of eligibility. For
                prostate cancer, only metastatic  castrate resistant prostate
                cancer is allowed.
