          arm_description: The preliminary efficacy and safety of BMS-986218 in
            combination with nivolumab will be assessed in participants with
            NSCLC who have progressed or relapsed after anti-PD-1/PD-L1 therapy.
            Participants must not have received prior anti-CTLA-4 therapy in the
            advanced or metastatic setting
        - dose_level:
            - level_code: BMS-986218
              level_internal_id: "10"
              level_suspended: N
              level_description: Dose(s) of BMS-986218 selected for Part 2C and Part 2D will
                be based on the totality of preliminary safety, tolerability,
                efficacy, PK and PD data.
            - level_code: Nivolumab
              level_internal_id: "11"
              level_suspended: N
              level_description: The nivolumab dose found to be tolerable in Part1B will be
                used in Part 2 combination expansions (Part 2C and Part 2D)
          arm_additional_criteria_not_captured:
            - additional_criteria_requirement_name: Participants must have received and then
                progressed on or after, or have been intolerant  or refractory
                to, at least 1 standard systemic therapy for metastatic and/or
                unresectable  disease (or have progressed within 6 months of
                adjuvant therapy). If the participant  refuses or is not
                eligible for these regimens, the reason must be documented in
                the  medical record and participant can be enrolled. (1) Prior
                treatment with fluoropyrimidine, oxaliplatin, and irinotecan
                given as single  regimen or over multiple regimens is required.
                (2) Prior treatment with an anti-angiogenic therapy (eg,
                bevacizumab) is required.
            - additional_criteria_requirement_name: Participants must have known
                microsatellite instability (MSI) or mismatch repair  status.
                Extended RAS (KRAS and NRAS), and BRAF status if known, should
                be  documented.  (1) If known to be RAS wild-type, available
                treatments with demonstrated benefit (eg, anti-EGFR therapy)
                must have been received as prior treatments if consistent
                with  approved local standard of care.  The Sponsor may elect to
                prioritize enrollment of participants based on mutation  status
                to ensure approximately 50 % of patients treated are RAS mutant.
          uuid: 957f42c6-18be-440a-a4c0-14992a97d3c0
