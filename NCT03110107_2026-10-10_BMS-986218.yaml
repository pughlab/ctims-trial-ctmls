          arm_description: The preliminary efficacy and safety of BMS 986218 in
            combination with nivolumab will be assessed in participants with MSS
            CRC who have progressed or relapsed on at least 1 prior standard
            therapy.
additional_criteria_requirements:
  - Eastern Cooperative Oncology Group Performance Status of 0 or 1
  - "Exclusion criteria: Cytotoxic agents, unless at least 4 weeks have elapsed
    from last dose of prior anti-cancer  therapy and initiation of study
    therapy."
  - "Exclusion criteria: Non-cytotoxic agents, unless at least 4 weeks or 5
    half-lives (whichever is shorter) have  elapsed from the last dose of prior
    anti-cancer therapy and the initiation of study therapy.  If 5 half-lives is
    shorter than 4 weeks, agreement with the Sponsor/Medical Monitor
    (or  designee) is mandatory"
  - "Exclusion criteria: Prior immunotherapy treatments, unless at least 4 weeks
    or 5 half-lives (whichever is  shorter) have elapsed from the last dose of
    immune therapy and initiation of study therapy."
  - "Exclusion criteria: Prior participation in an anti-CTLA-4-NF clinical study
    or therapy. "
  - "Exclusion criteria: Participants who have received prior curative radiation
    therapy must have been completed  at least 4 weeks prior to study drug
    administration. Prior focal palliative radiotherapy must  have been
    completed at least 2 weeks before study drug administration"
  - "Exclusion criteria: Prior organ allograft."
trial_id: NCT03110107
protocol_no: CA022001
long_title: Phase 1/2a First-In-Human Study of BMS-986218 Monoclonal Antibody
  Alone and in Combination with Nivolumab in Advanced Solid Tumors
short_title: Phase 1/2a Study of Monoclonal Antibody BMS-986218 Monotherapy and
  in Combination With Nivolumab in Patients With Advanced Solid Tumors
phase: I
age: Adult
nct_purpose: "This is a Phase 1/2a, open-label study of BMS-986218, administered
  as a single agent and in combination with  nivolumab, in participants with
  advanced solid tumors. The study is comprised of 2 parts: dose escalation and
  dose  expansion."
status: Terminated
