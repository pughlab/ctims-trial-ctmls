additional_criteria_requirements:
  - "Part 1: have a histologically or cytologically documented, locally advanced
    or metastatic solid malignancy. Each subject must have received at least 1
    and up to 5prior lines of cancer treatment regimen, excluding neo-adjuvant,
    adjuvant, maintenance treatment and surgery. Note: a repeat line of
    treatment does not count in the total number if the subject did not progress
    the first time; a 2-week or more duration of treatment counts in the total
    number of prior line of treatment if the subject progressed."
  - "Part 2: have a histologically confirmed adenocarcinoma originating from the
    colon or rectum (Stage 4 American Joint Committee on Cancer 7th edition).
    Must be non-MSI-H/dMMR CRC. Appendiceal cancer is included."
  - "Part 2: Experienced disease progression or was intolerant to at least 1 and
    up to 5 systemic chemotherapy regimen for metastatic non-MSI-H/dMMRCRC that
    must have included fluoropyrimidines and irinotecan, or oxaliplatin, ±
    anti-vascular endothelial growth factor or anti-epidermal growth factor
    receptor (if indicated by RAS mutational status); disease progression must
    have occurred within 3 months of the last systemic therapy administration.
    Subjects who were not deemed appropriate candidate for any of these agents
    due to medical history and/or contraindications may be eligible upon
    consultation with the Sponsor."
  - Provide an archival or newly obtained tumor tissue sample and blood samples
    for assessment of RAS/RAF mutation and pMMR/dMMR status and for biomarker
    analysis.
  - Have at least 1 measurable lesion as defined by RECIST 1.1 on imaging
    studies (CT or MRI) as assessed by the investigator/local radiology review.
    Cutaneous lesions and other superficial lesions that are detectable only by
    physical examination and subcutaneous lesions detectable by CT are not
    considered measurable lesions for the purposes of this protocol, but may be
    considered as nontarget lesions.
  - Be willing and able to provide written informed consent for the trial. The
    subject may also provide consent for FBR. However, the subject may
    participate in the main trial without participating in FBR.
  - Have a performance status of 0 or 1 on the ECOG Performance Scale. Have an
    anticipated life expectancy of at least 3 months. Be ≥18 years of age on day
    of signing the informed consent.
  - "Exclusion Criteria: Part 1: has received prior therapy with cancer
    vaccines, or compounds targeting PD-1 (including pembrolizumab), PD-L1,
    PD-L2, CTLA-4, or MEK. Note: Examples of MEK inhibitors include, but are not
    limited to, trametinib and cobimetinib."
  - "Exclusion Criteria: Part 2: has received prior therapy with cancer
    vaccines, or compounds targeting PD-1 (including pembrolizumab), PD-L1,
    PD-L2, CTLA-4, LAG-3, CD-137, OX-40, CD-40, GITR, BRAF, MEK or other
    molecules in the MAPK pathway. Note: Examples of BRAF inhibitors include,
    but are not limited to, dabrafenib and vemurafenib."
  - "Exclusion Criteria: Is currently participating in or has participated in a
    study of an investigational agent or using an investigational device within
    4 weeks prior to the first dose of trial treatment."
  - "Exclusion Criteria: Has taken during the 14 days prior to enrollment, or is
    currently taking medication that interferes with CYP3A4 or CYP2C8. Has
    Gilbert’s Syndrome."
  - "Exclusion Criteria: Has a diagnosis of immunodeficiency or is receiving
    chronic systemic steroid therapy (in doses exceeding 10 mg daily of
    prednisone equivalent) or any other form of immunosuppressive therapy within
    7 days prior to the first dose of trial treatment. The use of physiologic
    doses of corticosteroids may be approved after consultation with the
    Sponsor."
  - "Exclusion Criteria: Has had a prior anticancer mAb within 4 weeks prior to
    study Day 1 or who has not recovered (ie, ≤Grade 1 or at baseline) from AEs
    due to agents administered more than 4 weeks earlier. "
  - "Exclusion Criteria: Has had prior chemotherapy, targeted small molecule
    therapy, or radiation therapy within 14 days prior to study Day 1 or who has
    not recovered (ie, ≤Grade 1 or at baseline) from AEs due to a previously
    administered agent. Note: Subjects with ≤Grade 2 neuropathy or ≤Grade 2
    alopecia are an exception to this criterion and may qualify for the study
    upon consultation with the Sponsor. Note: If subject received major surgery,
    they must have recovered adequately from the toxicity and/or complications
    from the intervention prior to starting therapy."
  - "Exclusion Criteria: Part 2: Have a histologically confirmed adenocarcinoma
    originating from the colon or rectum that is microsatellite instable (ie,
    MSI-H)."
  - "Exclusion Criteria:  Has had an allogeneic tissue/solid organ transplant."
trial_id: NCT02972034
protocol_no: MK-8353
long_title: A Phase 1b Study to Evaluate the Safety and Tolerability of MK-8353
  in combination with Pembrolizumab in Patients with Advanced Malignancies
short_title: Phase 1b Study of MK-8353 + Pembrolizumab in Subjects with Advanced
  Malignancies
phase: I
protocol_version_no: 013-07
protocol_version_date: 2021-06-28T04:00:00.000Z
nct_purpose: This is a multicenter, worldwide, open-label, nonrandomized, Phase
  1b study of MK-8353 in  combination with pembrolizumab in subjects with
  advanced solid tumors with a focus on  subjects with ≥ second line advanced
  non-MSI-H/dMMR colorectal cancer (CRC). This study will evaluate the safety,
  tolerability, and preliminary efficacy of MK-8353 when administered in
  combination with pembrolizumab.
status: Terminated
age: Adult
principal_investigator: ""
