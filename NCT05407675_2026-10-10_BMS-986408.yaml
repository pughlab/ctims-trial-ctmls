additional_criteria_requirements:
  - Participants must have experienced radiographically documented progressive
    disease on or after the most recent therapy.
  - Eastern Cooperative Oncology Group (ECOG) performance status 0 or 1.
  - "Exclusion: Untreated central nervous system (CNS) metastases."
  - "Exclusion: Participation in another clinical trial concurrent with this
    study."
trial_id: NCT05407675
long_title: A Phase 1/2 Study of BMS-986408 Alone and in Combination with
  Nivolumab or with Nivolumab and Ipilimumab in Participants with Advanced Solid
  Tumors
short_title: A Phase 1/2 Study of BMS-986408 with and without Nivolumab or
  Nivolumab and Ipilimumab in Participants with Solid Tumors
phase: I and II
protocol_version_date: 2023-12-11T05:00:00.000Z
protocol_no: CA099003
protocol_version_no: Amendment 04
nct_purpose: The primary purpose of this study is to characterize the safety
  profile of BMS-986408 as monotherapy and in combination with nivolumab or
  nivolumab and ipilimumab to establish the maximum tolerated dose (MTD). The
  Recommended Phase 2 Dose (RP2D) that optimizes the
  pharmacokinetic/pharmacodynamic (PK/PD) relationship of BMS-986408 will also
  be determined.
status: Completed
principal_investigator: ""
age: Adult
